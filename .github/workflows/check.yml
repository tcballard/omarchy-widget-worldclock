name: Check World Clock
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update
      - run: sudo apt-get install -y libegl1 libopengl0 tzdata
      - run: pip install PySide6==6.11.2
      - run: node tests/model.cjs
      - run: python3 tests/qml_smoke.py
      - run: bash -n install-local scripts/times
