name: Check World Clock
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update
      - run: sudo apt-get install -y libegl1 libopengl0 tzdata
      - run: pip install PySide6==6.11.2
      - run: python3 tests/update.py
      - run: bash -n install-local
      - uses: actions/checkout@v4
        with:
          repository: tcballard/omarchy-widget-core
          ref: ba37e8c2fc19752420aea48bb97a116e250e4a69
          path: test-results/core
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.98.1
      - run: cargo build --locked --manifest-path test-results/core/Cargo.toml
      - run: |
          mkdir -p /tmp/worldclock-package
          cp widget.json LICENSE /tmp/worldclock-package/
          test-results/core/target/debug/omarchy-widget validate /tmp/worldclock-package
          cp widget.json test-results/core/examples/declarative-clock/widget.json
      - run: python3 test-results/core/sdk/render_previews.py test-results/declarative-previews --package .
      - run: python3 test-results/core/tests/declarative.py test-results/core/target/debug/omarchy-widget
      - run: python3 test-results/core/tests/declarative_controller.py test-results/core/target/debug/omarchy-widget
